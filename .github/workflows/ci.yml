name: CI checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [1.85.0, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install ${{ matrix.rust }} --profile minimal
      - run: cargo +${{ matrix.rust }} test --locked
      - run: cargo +${{ matrix.rust }} test --locked --no-default-features --features alloc
      - run: cargo +${{ matrix.rust }} test --locked --no-default-features
      - run: cargo +${{ matrix.rust }} build --locked --benches
      - run: cargo +${{ matrix.rust }} run --locked --example aes09

  no-std:
    name: no_std (${{ matrix.rust }}, ${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [1.85.0, stable]
        features: [none, alloc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install ${{ matrix.rust }} --profile minimal --target wasm32-unknown-unknown
      - if: matrix.features == 'none'
        run: cargo +${{ matrix.rust }} check --locked --target wasm32-unknown-unknown --no-default-features
      - if: matrix.features == 'alloc'
        run: cargo +${{ matrix.rust }} check --locked --target wasm32-unknown-unknown --no-default-features --features alloc

  test-32-bit:
    name: Native 32-bit tests (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [1.85.0, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: rustup toolchain install ${{ matrix.rust }} --profile minimal --target i686-unknown-linux-gnu
      - run: cargo +${{ matrix.rust }} test --locked --target i686-unknown-linux-gnu
      - run: cargo +${{ matrix.rust }} test --locked --target i686-unknown-linux-gnu --no-default-features --features alloc
      - run: cargo +${{ matrix.rust }} test --locked --target i686-unknown-linux-gnu --no-default-features

  lint:
    name: Clippy (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [1.85.0, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component clippy
      - run: cargo +${{ matrix.rust }} clippy --locked --all-targets -- -D warnings
      - run: cargo +${{ matrix.rust }} clippy --locked --no-default-features --features alloc --lib --tests -- -D warnings
      - run: cargo +${{ matrix.rust }} clippy --locked --no-default-features --lib --tests -- -D warnings

  compatibility-and-docs:
    name: Compatibility, formatting and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt
      - run: python3 scripts/check-compatibility.py
      - run: python3 scripts/reproduce-precision.py
      - run: cargo +1.85.0 fmt -- --check
      - run: cargo +1.85.0 doc --locked --all-features --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      - run: git diff --check
